name: Release Syncdian plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:merge
      - run: npm run test:client
      - run: npm run test:paths
      - run: npm run build
      - name: Create GitHub Release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js \
            manifest.json \
            versions.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Syncdian ${GITHUB_REF_NAME}" \
            --generate-notes
